    <style>
        /* --- Color Theme: neon-void --- */
        :root {
            --color-primary: #000000;
            --color-secondary: #ffffff;
            --color-accent: #ff3b00;
            --font-main: "Impact", system-ui, sans-serif;
        }

        /* --- Base Styles & Typography (Bold Raw Type) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-primary);
            color: var(--color-secondary);
            font-family: var(--font-main);
            /* Raw Texture Simulation via slight noise/pattern */
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.03) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.03) 75%, rgba(255, 255, 255, 0.03)), linear-gradient(-45deg, rgba(255, 255, 255, 0.03) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.03) 75%);
            background-size: 4px 4px;
        }

        a {
            color: var(--color-accent);
            text-decoration: none;
            transition: color 0.1s ease-in-out;
        }

        a:hover {
            color: #ff6b3d; /* Slightly brighter orange on hover */
            text-shadow: 2px 2px 0 var(--color-accent);
        }

        /* --- Layout & Spacing (Airy) --- */
        body {
            padding: 72px 0; /* Global Padding */
        }

        .section {
            gap: 48px; /* Internal Gap */
            padding: 0 72px; /* Side Padding */
        }
        
        .section-gap-xl {
             /* Section gap is handled by margin on the section itself, but this class ensures clear separation if needed */
             margin-bottom: 120px;
        }

        /* --- Header & Navigation --- */
        header {
            border-bottom: 4px solid var(--color-accent);
            padding-bottom: 32px; /* Adjusting header padding to fit overall flow */
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: none; /* Full bleed */
        }

        .logo h1 {
            font-size: 3rem; /* Oversized Typography Start */
            line-height: 1;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            color: var(--color-secondary);
            /* Visible Border Simulation on Logo */
            border: 3px solid var(--color-accent); 
            padding: 0 20px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 40px; /* Gap between nav items */
        }

        nav a {
            font-size: 1.3rem;
            text-transform: uppercase;
            font-weight: bold;
            padding: 5px 10px;
            border: 2px solid transparent;
            transition: all 0.1s ease-in-out;
        }

        nav a:hover {
             background-color: var(--color-accent);
             color: var(--color-primary);
             text-shadow: none;
        }

        /* Mobile Menu Button */
        .menu-toggle {
            display: none; /* Hidden by default (desktop) */
            font-size: 2rem;
            cursor: pointer;
            border: 3px solid var(--color-accent);
            padding: 5px 10px;
            line-height: 1;
        }

        /* --- Hero Section --- */
        #hero {
            text-align: center;
            padding: 80px 0; /* Slightly larger hero padding */
            border-top: 4px solid var(--color-accent);
            border-bottom: 4px solid var(--color-accent);
            margin-bottom: -20px; /* Slight overlap effect */
        }

        #hero h1 {
            font-size: clamp(3.5rem, 8vw, 6rem); /* Responsive Oversize */
            line-height: 1.1;
            text-transform: uppercase;
            margin-bottom: 20px;
            /* Skewed Element Simulation */
            transform: skewX(-5deg) translateY(5px); 
        }

        #hero p {
            font-size: clamp(1.3rem, 3vw, 1.8rem);
            margin-bottom: 40px;
            color: #aaaaaa; /* Slightly less bright than pure white */
            text-transform: uppercase;
        }

        /* --- Content Blocks (Asymmetric Layout) --- */
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr; /* Main content wider, Sidebar narrower */
            gap: 60px; /* Gap between major columns */
        }

        .main-content {
             /* Negative Margin for Overlap effect on the main section itself */
             margin-left: -30px; 
        }

        .sidebar {
            padding: 20px;
            border: 4px solid var(--color-accent);
            transform: rotate(1deg); /* Slight rotation for asymmetry */
            background-color: rgba(0, 0, 0, 0.3); /* Raw texture background hint */
        }

        /* Long Tail Keywords Section Styling */
        h2 {
            font-size: 2rem;
            text-transform: uppercase;
            padding-bottom: 10px;
            margin-bottom: 30px;
            border-bottom: 4px solid var(--color-accent); /* Visible border */
        }

        .keyword-list {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            margin-top: 20px;
        }

        .keyword-tag {
            padding: 12px 20px;
            border: 3px solid var(--color-accent);
            background-color: rgba(255, 59, 0, 0.1); /* Very light accent fill */
            text-transform: uppercase;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.1s ease, transform 0.1s ease;
        }

        .keyword-tag:hover {
             background-color: var(--color-accent);
             color: var(--color-primary);
             transform: scale(1.03) skewX(2deg); /* Subtle transformation on hover */
        }

        /* UGC Review Cards (Forced Asymmetry/Overlap within grid) */
        .review-card {
            background-color: rgba(255, 255, 255, 0.08); /* Semi-transparent white fill */
            border: 3px solid var(--color-accent);
            padding: 25px;
            margin-bottom: 25px;
            /* Forced Skew/Rotation for visual chaos */
            transform: skewX(3deg) rotate(-0.5deg); 
            position: relative; /* Needed for potential overlapping effects if we stack them */
        }

        .review-card::before {
            content: "★★★★★"; /* CSS Star Placeholder */
            font-size: 1.8rem;
            color: var(--color-accent);
            display: block;
            margin-bottom: 10px;
        }

        .reviewer-info {
            font-size: 0.9rem;
            opacity: 0.7;
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            border-top: 2px dashed rgba(255, 255, 255, 0.3);
            padding-top: 8px;
        }

        .reviewer-name {
            font-weight: bold;
            color: var(--color-secondary);
        }


        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 40px 72px;
            border-top: 6px solid var(--color-accent);
            font-size: 1rem;
            opacity: 0.8;
            /* Add a slight downward rotation to the footer for final flair */
            transform: rotate(0.5deg);
        }

        /* ================================== */
        /* --- RESPONSIVENESS (Mobile Adaptation) --- */
        /* ================================== */
        @media (max-width: 1024px) {
             /* General Spacing Adjustment for Tablets */
            .section {
                padding: 0 50px;
                gap: 36px;
            }

            .content-grid {
                grid-template-columns: 1fr; /* Single column stack */
                gap: 48px;
            }
            
            /* Force removal of negative margin effect on mobile, let it flow naturally */
            .main-content {
                 margin-left: 0; 
            }

             #hero h1 {
                 font-size: clamp(3rem, 10vw, 4.5rem);
             }
        }


        @media (max-width: 768px) {
            /* Header/Nav Adjustments */
            .nav-container {
                flex-direction: row; /* Ensure items line up horizontally initially */
                padding: 0 20px;
            }
             
            .logo h1 {
                 font-size: 2.5rem;
            }

            /* Toggle Button Visibility & Menu Display */
            .menu-toggle {
                display: block; /* Show the hamburger icon */
                order: 2; /* Place it after the logo */
            }

            nav {
                position: absolute;
                top: 105px; /* Below header area height */
                left: 0;
                width: 100%;
                background-color: var(--color-primary);
                padding: 20px 0;
                border-bottom: 4px solid var(--color-accent);
                display: none; /* Hidden by default */
                z-index: 10;
            }

            nav.active {
                display: block; /* Show when active */
            }

            nav ul {
                flex-direction: column; /* Stack navigation links vertically */
                align-items: center;
                gap: 25px;
            }
            
            nav a {
                width: 90%;
                text-align: center;
                padding: 12px 0;
                border: 2px solid var(--color-accent); /* Make mobile links look more button-like */
            }

            /* Footer Adjustment */
             footer {
                 padding: 30px 20px;
             }
        }

    </style>
